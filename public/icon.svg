<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B4A"/>
      <stop offset="100%" stop-color="#0B2A6F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD447"/>
      <stop offset="100%" stop-color="#F2B705"/>
    </linearGradient>
  </defs>
  <!-- Background Shield / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Gold Laurel / Border hint -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#gold)" stroke-width="8" stroke-opacity="0.35"/>
  
  <!-- Stylized Compass & Academic Crest -->
  <g transform="translate(256, 256)">
    <!-- Central Diamond / Star -->
    <path d="M 0 -150 L 36 -36 L 150 0 L 36 36 L 0 150 L -36 36 L -150 0 L -36 -36 Z" fill="url(#gold)"/>
    <!-- Navy Inner Core -->
    <circle cx="0" cy="0" r="44" fill="#071B4A"/>
    <!-- Gold Dot -->
    <circle cx="0" cy="0" r="18" fill="#F2B705"/>
    
    <!-- Open Book Base -->
    <path d="M -110 80 Q -50 65 0 88 Q 50 65 110 80 L 110 135 Q 50 120 0 145 Q -50 120 -110 135 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 0 88 L 0 145" stroke="#0B2A6F" stroke-width="4"/>
  </g>
</svg>
